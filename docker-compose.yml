services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financial_helpdesk}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-financial_helpdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn financial_helpdesk.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-with-production-secret-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-financial_helpdesk}
      REDIS_URL: redis://redis:6379/1
      STORAGE_BACKEND: ${STORAGE_BACKEND:-shared_fs}
      MEDIA_ROOT: /app/media
      BACKGROUND_TASK_MODE: ${BACKGROUND_TASK_MODE:-db_queue}
      SITE_URL: ${SITE_URL:-http://localhost:8000}
      MICROSOFT_AUTH_ENABLED: ${MICROSOFT_AUTH_ENABLED:-False}
      MICROSOFT_ALLOW_LOCAL_LOGIN: ${MICROSOFT_ALLOW_LOCAL_LOGIN:-True}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      MICROSOFT_POST_LOGOUT_REDIRECT_URI: ${MICROSOFT_POST_LOGOUT_REDIRECT_URI:-}
      MICROSOFT_AUTHORITY_HOST: ${MICROSOFT_AUTHORITY_HOST:-https://login.microsoftonline.com}
      MICROSOFT_OIDC_SCOPES: ${MICROSOFT_OIDC_SCOPES:-openid,profile,email}
      MICROSOFT_ALLOWED_TENANTS: ${MICROSOFT_ALLOWED_TENANTS:-}
      MICROSOFT_ALLOWED_GROUPS: ${MICROSOFT_ALLOWED_GROUPS:-}
      MICROSOFT_AUTO_PROVISION_USERS: ${MICROSOFT_AUTO_PROVISION_USERS:-False}
      MICROSOFT_LINK_EXISTING_BY_EMAIL: ${MICROSOFT_LINK_EXISTING_BY_EMAIL:-True}
      MICROSOFT_ROLE_MAPPING: ${MICROSOFT_ROLE_MAPPING:-}
      MICROSOFT_DEPARTMENT_CLAIM: ${MICROSOFT_DEPARTMENT_CLAIM:-department}
      MICROSOFT_UNMAPPED_USER_POLICY: ${MICROSOFT_UNMAPPED_USER_POLICY:-keep_existing}
      MICROSOFT_STRICT_ROLE_SYNC: ${MICROSOFT_STRICT_ROLE_SYNC:-True}
      MICROSOFT_GRAPH_GROUP_FALLBACK: ${MICROSOFT_GRAPH_GROUP_FALLBACK:-False}
      MICROSOFT_HTTP_TIMEOUT: ${MICROSOFT_HTTP_TIMEOUT:-10}
      MICROSOFT_TOKEN_CLOCK_SKEW_SECONDS: ${MICROSOFT_TOKEN_CLOCK_SKEW_SECONDS:-60}
      MICROSOFT_TEAMS_ENABLED: ${MICROSOFT_TEAMS_ENABLED:-False}
      MICROSOFT_TEAMS_APP_ID: ${MICROSOFT_TEAMS_APP_ID:-}
      MICROSOFT_TEAMS_FRAME_ANCESTORS: ${MICROSOFT_TEAMS_FRAME_ANCESTORS:-https://teams.microsoft.com https://*.teams.microsoft.com https://*.skype.com https://*.office.com}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-300}
      MICROSOFT_NOTIFICATIONS_ENABLED: ${MICROSOFT_NOTIFICATIONS_ENABLED:-False}
      MICROSOFT_TEAMS_WEBHOOK_URL: ${MICROSOFT_TEAMS_WEBHOOK_URL:-}
    volumes:
      - shared_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: python manage.py run_worker --poll-interval 2
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-with-production-secret-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-financial_helpdesk}
      REDIS_URL: redis://redis:6379/1
      STORAGE_BACKEND: ${STORAGE_BACKEND:-shared_fs}
      MEDIA_ROOT: /app/media
      BACKGROUND_TASK_MODE: db_queue
      SITE_URL: ${SITE_URL:-http://localhost:8000}
      MICROSOFT_NOTIFICATIONS_ENABLED: ${MICROSOFT_NOTIFICATIONS_ENABLED:-False}
      MICROSOFT_TEAMS_WEBHOOK_URL: ${MICROSOFT_TEAMS_WEBHOOK_URL:-}
    volumes:
      - shared_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  shared_media:
