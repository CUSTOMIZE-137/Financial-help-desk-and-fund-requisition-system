# Production Nginx HTTPS reverse-proxy configuration for FinanceDesk & Microsoft Teams
# Replace financedesk.example.org and TLS certificate paths with your organization's values.

upstream financedesk_app {
    server web:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name financedesk.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name financedesk.example.org;

    ssl_certificate     /etc/ssl/certs/financedesk.crt;
    ssl_certificate_key /etc/ssl/private/financedesk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 16M;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://financedesk_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
